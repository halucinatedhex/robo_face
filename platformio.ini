; robo_face -- ESP32 robot face, ported from the AVR CurtiBotEyes sketch
[common]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags   = -std=gnu++17
; -Wall on project sources only: library warnings would bury our own.
build_src_flags = -Wall
build_unflags = -std=gnu++11
; The default 4MB table gives the app only 1.25MB, and WiFi plus the web
; server does not fit. min_spiffs keeps two OTA slots at 1.9MB each.
board_build.partitions = partitions_audio.csv
board_build.filesystem  = littlefs

; The face firmware.
[env:esp32dev]
extends          = common
build_src_filter = +<*> -<diag/>

; Hardware bring-up diagnostic. Bit-bangs the MAX7219 with no SPI and no
; driver code, so a failure here is wiring or power, not firmware.
;   ~/.platformio/penv/bin/pio run -e diag -t upload
[env:diag]
extends          = common
build_src_filter = -<*> +<diag/>

; LuatOS / AirM2M CORE ESP32-C3.
;   ~/.platformio/penv/bin/pio run -e c3 -t upload
;
; This board has no USB-UART bridge -- it enumerates as the ESP32-C3's own
; USB Serial/JTAG unit (VID:PID 303A:1001). ARDUINO_USB_CDC_ON_BOOT points
; Serial at that USB endpoint; without it Serial goes to UART0 on GPIO20/21,
; which is not wired to the USB connector, and all output vanishes.
[c3common]
extends     = common
board       = airm2m_core_esp32c3
build_flags = ${common.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3]
extends          = c3common
build_src_filter = +<*> -<diag/>

; Bring-up diagnostic on the C3.
[env:c3-diag]
extends          = c3common
build_src_filter = -<*> +<diag/>
