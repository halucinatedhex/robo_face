<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 214" width="820" height="214" font-family="ui-sans-serif,system-ui,sans-serif"><title>Audio output wiring</title><rect width="820" height="214" fill="none"/><text x="20" y="24" font-size="13" fill="#2b2b3a" text-anchor="start" font-weight="600">Audio — the ESP32-C3 has no DAC, so PDM plus a passive filter</text><rect x="20" y="50" width="96" height="60" rx="6" fill="#fff7ef" stroke="#e8720c" stroke-width="1.5"/><text x="68.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">gpio 4</text><text x="68.0" y="91.0" text-anchor="middle" font-size="10.5" fill="#7a7a8c" dominant-baseline="middle">PDM out</text><path d="M116,80 L150,80" fill="none" stroke="#e8720c" stroke-width="2.5"/><rect x="150" y="71" width="58" height="18" fill="#fff" stroke="#2b2b3a" stroke-width="1.5"/><text x="179" y="84" font-size="11" fill="#2b2b3a" text-anchor="middle" font-weight="600">1k</text><path d="M208,80 L265,80" fill="none" stroke="#e8720c" stroke-width="2.5"/><path d="M236,80 L236,114" fill="none" stroke="#e8720c" stroke-width="2"/><path d="M223,114 L249,114 M223,122 L249,122" stroke="#2b2b3a" stroke-width="2"/><path d="M236,122 L236,136" fill="none" stroke="#333" stroke-width="2"/><path d="M224,136 L248,136 M229,141 L243,141 M233,146 L239,146" stroke="#333" stroke-width="1.8"/><text x="254" y="122" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">10nF</text><rect x="265" y="71" width="58" height="18" fill="#fff" stroke="#2b2b3a" stroke-width="1.5"/><text x="294" y="84" font-size="11" fill="#2b2b3a" text-anchor="middle" font-weight="600">1k</text><path d="M323,80 L360,80" fill="none" stroke="#e8720c" stroke-width="2.5"/><path d="M341,80 L341,114" fill="none" stroke="#e8720c" stroke-width="2"/><path d="M328,114 L354,114 M328,122 L354,122" stroke="#2b2b3a" stroke-width="2"/><path d="M341,122 L341,136" fill="none" stroke="#333" stroke-width="2"/><path d="M329,136 L353,136 M334,141 L348,141 M338,146 L344,146" stroke="#333" stroke-width="1.8"/><text x="359" y="122" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">10nF</text><path d="M398,69 L398,91 M408,69 L408,91" stroke="#2b2b3a" stroke-width="2.4"/><text x="403" y="62" font-size="10.5" fill="#7a7a8c" text-anchor="middle" font-weight="400">1µF</text><path d="M408,80 L452,80" fill="none" stroke="#e8720c" stroke-width="2.5"/><rect x="452" y="50" width="110" height="60" rx="6" fill="#fff" stroke="#2b2b3a" stroke-width="1.5"/><text x="507.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">Amp</text><text x="507.0" y="91.0" text-anchor="middle" font-size="10.5" fill="#7a7a8c" dominant-baseline="middle">PAM8403</text><path d="M562,80 L600,80" fill="none" stroke="#4a4a5e" stroke-width="2.5"/><rect x="600" y="50" width="86" height="60" rx="6" fill="#ffffff" stroke="#2b2b3a" stroke-width="1.5"/><text x="643.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">Speaker</text><text x="643.0" y="91.0" text-anchor="middle" font-size="10.5" fill="#7a7a8c" dominant-baseline="middle">4–8 Ω</text><text x="20" y="178" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">Corner near 16 kHz: the PDM carrier is ~1 MHz and speech is under 8 kHz. 10nF, not 100nF — 100nF muffles it.</text><text x="20" y="196" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">gpio 5 is the PDM clock. The driver demands a pin; leave it unconnected.</text></svg>