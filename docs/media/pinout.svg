<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382" font-family="ui-sans-serif,system-ui,sans-serif"><title>ESP32-C3 pin assignment</title><rect width="640" height="382" fill="none"/><text x="20" y="24" font-size="13" fill="#2b2b3a" text-anchor="start" font-weight="600">ESP32-C3 pin assignment</text><rect x="20" y="44" width="120" height="270" rx="6" fill="#fff7ef" stroke="#e8720c" stroke-width="1.5"/><text x="80.0" y="179.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">ESP32-C3</text><path d="M140,70 L184,70" fill="none" stroke="#36c" stroke-width="2"/><circle cx="140" cy="70" r="3" fill="#36c"/><text x="190" y="74" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 2</text><text x="258" y="74" font-size="11" fill="#36c" text-anchor="start" font-weight="400">Matrix CLK</text><path d="M140,96 L184,96" fill="none" stroke="#e8720c" stroke-width="2"/><circle cx="140" cy="96" r="3" fill="#e8720c"/><text x="190" y="100" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 3</text><text x="258" y="100" font-size="11" fill="#e8720c" text-anchor="start" font-weight="400">Matrix DIN</text><path d="M140,122 L184,122" fill="none" stroke="#2a8" stroke-width="2"/><circle cx="140" cy="122" r="3" fill="#2a8"/><text x="190" y="126" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 7</text><text x="258" y="126" font-size="11" fill="#2a8" text-anchor="start" font-weight="400">Matrix CS</text><path d="M140,148 L184,148" fill="none" stroke="#e8720c" stroke-width="2"/><circle cx="140" cy="148" r="3" fill="#e8720c"/><text x="190" y="152" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 4</text><text x="258" y="152" font-size="11" fill="#e8720c" text-anchor="start" font-weight="400">Audio PDM out</text><path d="M140,174 L184,174" fill="none" stroke="#7a7a8c" stroke-width="2"/><circle cx="140" cy="174" r="3" fill="#7a7a8c"/><text x="190" y="178" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 5</text><text x="258" y="178" font-size="11" fill="#7a7a8c" text-anchor="start" font-weight="400">PDM clock — leave unconnected</text><path d="M140,200 L184,200" fill="none" stroke="#2a8" stroke-width="2"/><circle cx="140" cy="200" r="3" fill="#2a8"/><text x="190" y="204" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 6</text><text x="258" y="204" font-size="11" fill="#2a8" text-anchor="start" font-weight="400">PIR motion in</text><path d="M140,226 L184,226" fill="none" stroke="#36c" stroke-width="2"/><circle cx="140" cy="226" r="3" fill="#36c"/><text x="190" y="230" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 10</text><text x="258" y="230" font-size="11" fill="#36c" text-anchor="start" font-weight="400">Toggle → GND</text><path d="M140,252 L184,252" fill="none" stroke="#36c" stroke-width="2"/><circle cx="140" cy="252" r="3" fill="#36c"/><text x="190" y="256" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 0</text><text x="258" y="256" font-size="11" fill="#36c" text-anchor="start" font-weight="400">Button → GND</text><path d="M140,278 L184,278" fill="none" stroke="#7a7a8c" stroke-width="2"/><circle cx="140" cy="278" r="3" fill="#7a7a8c"/><text x="190" y="282" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 1</text><text x="258" y="282" font-size="11" fill="#7a7a8c" text-anchor="start" font-weight="400">free</text><path d="M140,304 L184,304" fill="none" stroke="#7a7a8c" stroke-width="2"/><circle cx="140" cy="304" r="3" fill="#7a7a8c"/><text x="190" y="308" font-size="11.5" fill="#2b2b3a" text-anchor="start" font-weight="600">gpio 20</text><text x="258" y="308" font-size="11" fill="#7a7a8c" text-anchor="start" font-weight="400">free</text><text x="20" y="348" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">Do not use gpio 8, 9 (strapping), 11–17 (SPI flash) or 18, 19 (USB).</text><text x="20" y="366" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">Matrices and amp run from an external 5 V supply, not the board. Tie all grounds.</text></svg>