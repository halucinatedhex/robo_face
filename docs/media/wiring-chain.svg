<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="780" height="240" font-family="ui-sans-serif,system-ui,sans-serif"><title>LED matrix chain wiring</title><rect width="780" height="240" fill="none"/><text x="20" y="24" font-size="13" fill="#2b2b3a" text-anchor="start" font-weight="600">LED matrix chain — every signal passes through each module</text><rect x="20" y="56" width="96" height="80" rx="6" fill="#fff7ef" stroke="#e8720c" stroke-width="1.5"/><text x="68.0" y="90.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">ESP32-C3</text><text x="68.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#7a7a8c" dominant-baseline="middle">AirM2M CORE</text><rect x="186" y="56" width="104" height="80" rx="6" fill="#ffffff" stroke="#2b2b3a" stroke-width="1.5"/><text x="238.0" y="90.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">Mod 0</text><text x="238.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#7a7a8c" dominant-baseline="middle">left eye</text><text x="190" y="70" font-size="8" fill="#7a7a8c" text-anchor="start" font-weight="400">IN</text><text x="286" y="70" font-size="8" fill="#7a7a8c" text-anchor="end" font-weight="400">OUT</text><rect x="336" y="56" width="104" height="80" rx="6" fill="#ffffff" stroke="#2b2b3a" stroke-width="1.5"/><text x="388.0" y="90.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">Mod 1</text><text x="388.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#7a7a8c" dominant-baseline="middle">right eye</text><text x="340" y="70" font-size="8" fill="#7a7a8c" text-anchor="start" font-weight="400">IN</text><text x="436" y="70" font-size="8" fill="#7a7a8c" text-anchor="end" font-weight="400">OUT</text><rect x="486" y="56" width="104" height="80" rx="6" fill="#ffffff" stroke="#2b2b3a" stroke-width="1.5"/><text x="538.0" y="90.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">Mod 2</text><text x="538.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#7a7a8c" dominant-baseline="middle">mouth L</text><text x="490" y="70" font-size="8" fill="#7a7a8c" text-anchor="start" font-weight="400">IN</text><text x="586" y="70" font-size="8" fill="#7a7a8c" text-anchor="end" font-weight="400">OUT</text><rect x="636" y="56" width="104" height="80" rx="6" fill="#ffffff" stroke="#2b2b3a" stroke-width="1.5"/><text x="688.0" y="90.0" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2b3a" dominant-baseline="middle">Mod 3</text><text x="688.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#7a7a8c" dominant-baseline="middle">mouth R</text><text x="640" y="70" font-size="8" fill="#7a7a8c" text-anchor="start" font-weight="400">IN</text><text x="736" y="70" font-size="8" fill="#7a7a8c" text-anchor="end" font-weight="400">OUT</text><path d="M116,68 L186,68" fill="none" stroke="#d33" stroke-width="2"/><path d="M116,82 L186,82" fill="none" stroke="#333" stroke-width="2"/><path d="M116,96 L186,96" fill="none" stroke="#e8720c" stroke-width="2"/><path d="M116,110 L186,110" fill="none" stroke="#2a8" stroke-width="2"/><path d="M116,124 L186,124" fill="none" stroke="#36c" stroke-width="2"/><text x="118" y="64" font-size="8" fill="#d33" text-anchor="start" font-weight="600">5 V</text><text x="118" y="78" font-size="8" fill="#333" text-anchor="start" font-weight="600">GND</text><text x="118" y="92" font-size="8" fill="#e8720c" text-anchor="start" font-weight="600">DIN</text><text x="118" y="106" font-size="8" fill="#2a8" text-anchor="start" font-weight="600">CS</text><text x="118" y="120" font-size="8" fill="#36c" text-anchor="start" font-weight="600">CLK</text><path d="M290,68 L336,68" fill="none" stroke="#d33" stroke-width="2"/><path d="M290,82 L336,82" fill="none" stroke="#333" stroke-width="2"/><path d="M290,96 L336,96" fill="none" stroke="#e8720c" stroke-width="2"/><path d="M290,110 L336,110" fill="none" stroke="#2a8" stroke-width="2"/><path d="M290,124 L336,124" fill="none" stroke="#36c" stroke-width="2"/><path d="M440,68 L486,68" fill="none" stroke="#d33" stroke-width="2"/><path d="M440,82 L486,82" fill="none" stroke="#333" stroke-width="2"/><path d="M440,96 L486,96" fill="none" stroke="#e8720c" stroke-width="2"/><path d="M440,110 L486,110" fill="none" stroke="#2a8" stroke-width="2"/><path d="M440,124 L486,124" fill="none" stroke="#36c" stroke-width="2"/><path d="M590,68 L636,68" fill="none" stroke="#d33" stroke-width="2"/><path d="M590,82 L636,82" fill="none" stroke="#333" stroke-width="2"/><path d="M590,96 L636,96" fill="none" stroke="#e8720c" stroke-width="2"/><path d="M590,110 L636,110" fill="none" stroke="#2a8" stroke-width="2"/><path d="M590,124 L636,124" fill="none" stroke="#36c" stroke-width="2"/><text x="20" y="166" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">One 5-way cable per hop: 5 V, GND, data, CS, CLK. The output header of each module feeds the input of the next,</text><text x="20" y="182" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">so CLK, CS and power become common to the whole chain without any separate bus wiring. Only the data line is</text><text x="20" y="198" font-size="10.5" fill="#7a7a8c" text-anchor="start" font-weight="400">consumed and regenerated: a module's DOUT carries what it did not keep.</text><text x="20" y="222" font-size="10.5" fill="#2b2b3a" text-anchor="start" font-weight="600">Device 0 is the module the board plugs into. Order must be: left eye, right eye, mouth left, mouth right.</text></svg>